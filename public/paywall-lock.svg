<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Etapa bloqueada — desbloqueie o acompanhamento">
  <!-- Cadeado editorial grande com fita de estrada passando pelo arco -->
  <!-- fita de estrada atravessando o arco -->
  <path d="M60 470 C 160 420, 200 300, 300 250 C 400 200, 460 160, 560 90" fill="none" stroke="#F7F3EA" stroke-width="34" stroke-linecap="round" opacity="0.9"/>
  <path d="M60 470 C 160 420, 200 300, 300 250 C 400 200, 460 160, 560 90" fill="none" stroke="#14201B" stroke-width="5" stroke-dasharray="18 22" stroke-linecap="round"/>
  <!-- arco do cadeado -->
  <path d="M205 300 L205 220 Q205 130 300 130 Q395 130 395 220 L395 300" fill="none" stroke="#14201B" stroke-width="44" stroke-linecap="round"/>
  <path d="M205 300 L205 220 Q205 130 300 130 Q395 130 395 220 L395 300" fill="none" stroke="#F2B53F" stroke-width="28" stroke-linecap="round"/>
  <!-- corpo do cadeado -->
  <rect x="155" y="290" width="290" height="230" rx="36" fill="#F2B53F" stroke="#14201B" stroke-width="14"/>
  <!-- fechadura -->
  <circle cx="300" cy="385" r="30" fill="#14201B"/>
  <path d="M300 400 L288 462 Q300 474 312 462 Z" fill="#14201B"/>
  <!-- brilho -->
  <path d="M195 330 Q195 322 205 322 L250 322" fill="none" stroke="#F7F3EA" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
</svg>
