<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="IsentaPCD">
  <!-- símbolo: selo âmbar com check desenhado à mão e estrada curva atravessando -->
  <g>
    <circle cx="32" cy="32" r="26" fill="#F2B53F"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#14201B" stroke-width="3"/>
    <!-- estrada curva atravessando o selo -->
    <path d="M4 44 C 18 36, 30 40, 42 30 S 56 18, 62 16" fill="none" stroke="#14201B" stroke-width="5" stroke-linecap="round"/>
    <path d="M10 42.5 C 20 37, 30 39.5, 40 32 S 53 21, 58 19" fill="none" stroke="#F7F3EA" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 5"/>
    <!-- check desenhado à mão -->
    <path d="M20 26 C 23 30, 26 34, 28.5 37.5 C 33 29, 40 21, 47 15.5" fill="none" stroke="#F7F3EA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 26 C 23 30, 26 34, 28.5 37.5 C 33 29, 40 21, 47 15.5" fill="none" stroke="#14201B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="70" y="41" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="-0.5">
    <tspan fill="#F7F3EA">Isenta</tspan><tspan fill="#F2B53F">PCD</tspan>
  </text>
</svg>
