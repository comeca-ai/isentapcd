<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Ruído de papel sutil, tileável. Aplicar com opacidade ~3% sobre fundos dark. -->
  <filter id="paper-noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0.5 0"/>
  </filter>
  <rect width="200" height="200" filter="url(#paper-noise)"/>
</svg>
